# Declarative Automation Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  name: "sample-dab"

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-997428e2-b857.cloud.databricks.com
      root_path: /Workspace/Dev/

  # The 'prod' target, used for production deployment.
  prod:
    mode: production
    workspace:
      host: https://dbc-997428e2-b857.cloud.databricks.com
      # We always use /Users/shrutipenumetsa@gmail.com for all resources to make sure we only have a single copy.
      root_path: /Workspace/Dev/${bundle.name}
    run_as:
      # This runs as shrutipenumetsa@gmail.com in production. We could also use a service principal here,
      # see https://docs.databricks.com/dev-tools/bundles/permissions.html.
      user_name: shrutipenumetsa@gmail.com
